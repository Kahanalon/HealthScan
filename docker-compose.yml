services:
  db:
    image: postgres:16-alpine
    container_name: healthscan-db
    environment:
      POSTGRES_DB: healthscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/HealthScan.Api/Dockerfile
    container_name: healthscan-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=healthscan;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
